spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

finsight.jwt.secret=${JWT_SECRET}
finsight.jwt.expiration=${JWT_EXPIRATION_MS:3600000}

server.port=${SERVER_PORT:8081}
spring.liquibase.enabled=${LIQUIBASE_ENABLED:false}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

finsight.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}

finsight.health-score.minimum-transactions=${HEALTH_SCORE_MINIMUM_TRANSACTIONS:5}
finsight.health-score.minimum-active-months=${HEALTH_SCORE_MINIMUM_ACTIVE_MONTHS:3}
finsight.health-score.target-emergency-months=${HEALTH_SCORE_TARGET_EMERGENCY_MONTHS:6}
finsight.health-score.weights.savings=${HEALTH_SCORE_WEIGHT_SAVINGS:20}
finsight.health-score.weights.expense-control=${HEALTH_SCORE_WEIGHT_EXPENSE_CONTROL:15}
finsight.health-score.weights.cash-flow=${HEALTH_SCORE_WEIGHT_CASH_FLOW:15}
finsight.health-score.weights.budget=${HEALTH_SCORE_WEIGHT_BUDGET:10}
finsight.health-score.weights.emergency-fund=${HEALTH_SCORE_WEIGHT_EMERGENCY_FUND:15}
finsight.health-score.weights.debt-burden=${HEALTH_SCORE_WEIGHT_DEBT_BURDEN:15}
finsight.health-score.weights.goal-progress=${HEALTH_SCORE_WEIGHT_GOAL_PROGRESS:10}

finsight.anomaly.minimum-baseline-transactions=${ANOMALY_MINIMUM_BASELINE_TRANSACTIONS:5}
finsight.anomaly.minimum-amount-multiple=${ANOMALY_MINIMUM_AMOUNT_MULTIPLE:2}
finsight.anomaly.minimum-standard-deviations=${ANOMALY_MINIMUM_STANDARD_DEVIATIONS:2}

finsight.gemini.api-key=${GEMINI_API_KEY:}
finsight.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
finsight.gemini.max-requests-per-hour=${GEMINI_MAX_REQUESTS_PER_HOUR:10}