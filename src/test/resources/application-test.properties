spring.datasource.url=jdbc:h2:mem:finsight;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.main.allow-bean-definition-overriding=true
finsight.jwt.secret=test-only-signing-key-that-is-at-least-32-bytes-long
finsight.jwt.expiration=3600000
finsight.gemini.api-key=
